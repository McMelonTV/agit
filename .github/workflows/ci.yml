name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.5'
          check-latest: true
      - name: Test
        run: go test ./...
      - name: Check formatting
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)"
      - name: Vet
        if: runner.os == 'Linux'
        run: go vet ./...
      - name: Race tests
        if: runner.os == 'Linux'
        run: go test -race ./...
      - name: Build release archives
        if: runner.os == 'Linux'
        run: VERSION=ci ./scripts/build-release.sh

  compatibility:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.12'
          check-latest: true
      - run: go test ./...
